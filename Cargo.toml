[package]
name = "vibe-watch"
version = "0.1.0"
edition = "2021"
description = "Monitor Copilot coding agent token and AI credit usage from session logs"
license = "MIT"

[[bin]]
name = "vibe-watch"
path = "src/main.rs"

[lib]
name = "vibe_watch"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = { version = "0.25", default-features = false, features = ["std"] }
